<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 50">
  <!-- Newspaper base -->
  <rect x="4" y="28" width="32" height="22" rx="2.5" fill="#1a1a1a"/>
  <!-- Newspaper headline line (behind flame — the burning headline) -->
  <rect x="9" y="31" width="22" height="2.5" rx="1" fill="rgba(255,255,255,0.55)"/>
  <!-- Visible content lines below flame -->
  <rect x="9" y="38" width="16" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>
  <rect x="9" y="43" width="18" height="2" rx="1" fill="rgba(255,255,255,0.35)"/>
  <!-- Flame outer shape -->
  <path d="M20 36 C12 36 5 26 8 16 C10 10 16 4 20 3 C24 4 30 10 32 16 C35 26 28 36 20 36Z"
        fill="url(#fo)"/>
  <!-- Flame inner highlight -->
  <path d="M20 32 C16 30 14 24 16 18 C17 14 20 11 20 11 C20 11 23 14 24 18 C26 24 24 30 20 32Z"
        fill="url(#fi)" opacity="0.82"/>
  <defs>
    <linearGradient id="fo" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="fi" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fffde7"/>
    </linearGradient>
  </defs>
</svg>
